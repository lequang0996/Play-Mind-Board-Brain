name: Bot gauge

# Đo bot của app với engine ngoài (BOT_GUIDE mục 3.5). Engine ngoài chỉ dùng để đo, không phát hành cùng app.
# Kích hoạt: sửa tools/bot-bench/gauge/request.txt rồi push lên main (hoặc chạy tay). Kết quả được commit
# vào nhánh gauge-results (results/<tag>.txt) và hiện trong Summary của lượt chạy.

on:
  push:
    branches: [main]
    paths: ["tools/bot-bench/gauge/request.txt"]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.14.3"
  SF_TAG: "sf_17.1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          kv = {}
          for line in open("tools/bot-bench/gauge/request.txt", encoding="utf-8"):
              line = line.split("#", 1)[0].strip()
              if "=" in line:
                  k, v = line.split("=", 1); kv[k.strip()] = v.strip()
          inc = []
          for elo in kv["elos"].split():
              for s in range(int(kv.get("shards", "1"))):
                  inc.append(dict(elo=int(elo), shard=s, game=kv.get("game", "chess"), games=int(kv["games"]),
                                  ourMs=int(kv["ourMs"]), sfMs=int(kv["sfMs"])))
          print("matrix=" + json.dumps({"include": inc}))
          print("tag=" + kv["tag"])
          EOF

  gauge:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - uses: actions/cache@v4
        id: sfcache
        with: { path: sfbin, key: "stockfish-${{ env.SF_TAG }}-avx2" }
      - name: Build Stockfish (engine đo, GPL-3.0, không phát hành)
        if: steps.sfcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SF_TAG" https://github.com/official-stockfish/Stockfish.git sf
          make -C sf/src -j"$(nproc)" build ARCH=x86-64-avx2 >/dev/null
          mkdir -p sfbin && cp sf/src/stockfish sfbin/stockfish
      - name: Gauge
        run: |
          seed=$(( ${{ matrix.shard }} * 1000 + 7 ))
          gradle :core:gauge --no-daemon -q --args="${{ matrix.game }} $PWD/sfbin/stockfish ${{ matrix.elo }} ${{ matrix.games }} ${{ matrix.ourMs }} ${{ matrix.sfMs }} $seed" | tee out.txt
          grep -q '^TOTAL' out.txt
          { echo "# elo=${{ matrix.elo }} shard=${{ matrix.shard }} ourMs=${{ matrix.ourMs }} sfMs=${{ matrix.sfMs }} cpu=$(nproc) $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"; grep -E '^(G|TOTAL) ' out.txt; } > "part-${{ matrix.elo }}-${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.elo }}-${{ matrix.shard }}", path: "part-*.txt" }

  collect:
    needs: [plan, gauge]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - name: Summarize
        run: |
          python3 - "${{ needs.plan.outputs.tag }}" <<'EOF'
          import glob, math, re, sys, os
          tag = sys.argv[1]; agg = {}; raw = []
          for p in sorted(glob.glob("parts/part-*.txt")):
              txt = open(p).read(); raw.append(txt)
              head = txt.splitlines()[0]; elo = int(re.search(r"elo=(\d+)", head).group(1))
              m = re.search(r"^TOTAL (\d+) (\d+) (\d+)", txt, re.M)
              if not m: continue
              a = agg.setdefault(elo, [0, 0, 0])
              for i in range(3): a[i] += int(m.group(i + 1))
          lines = [f"# tag={tag}", "| Stockfish UCI_Elo | Ván | Thắng/Hòa/Thua | Điểm | Elo ước lượng của bot |", "|---|---|---|---|---|"]
          for elo in sorted(agg):
              w, d, l = agg[elo]; n = w + d + l; s = (w + d / 2) / n if n else 0
              est = f"{elo + 400 * math.log10(s / (1 - s)):.0f}" if 0.05 < s < 0.95 else ("> " if s >= 0.95 else "< ") + str(elo)
              lines.append(f"| {elo} | {n} | {w}/{d}/{l} | {s:.3f} | {est} |")
          table = "\n".join(lines)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(table + "\n")
          os.makedirs("out", exist_ok=True)
          open(f"out/{tag}.txt", "w").write(table + "\n\n" + "\n".join(raw))
          print(table)
          EOF
      - name: Commit to gauge-results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r out /tmp/gauge-out
          if git ls-remote --exit-code origin gauge-results >/dev/null; then
            git fetch origin gauge-results && git checkout -f -B gauge-results origin/gauge-results
          else
            git checkout -f --orphan gauge-results && git rm -rf --quiet . && git clean -fdq
          fi
          mkdir -p results && cp /tmp/gauge-out/*.txt results/
          git add results && git commit -m "gauge ${{ needs.plan.outputs.tag }}" && git push origin gauge-results
