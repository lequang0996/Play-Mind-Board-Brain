name: Store screenshots

# Chạy thủ công (Actions → Store screenshots → Run workflow).
# Dựng bản debug, mở ScreenshotActivity trên emulator, chụp màn hình thật (sáng/tối, 2 ngôn ngữ)
# rồi commit vào store/screenshots/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/take_screenshots.sh
      - name: Compress screenshots (lossless)
        run: |
          pip install pillow pyoxipng
          python3 tools/compress_images.py
      - name: Commit screenshots
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add store/screenshots
          git commit -m "chore: update store screenshots" || echo "no changes"
          git push
