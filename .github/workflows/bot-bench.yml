name: Bot bench

# Đo bot (BOT_GUIDE mục 3): đấu giữa các cấp (ladder) và đấu engine ngoài (gauge, Stockfish chỉ để đo, không phát hành).
# Kích hoạt: sửa tools/bot-bench/request.txt rồi push lên main (hoặc chạy tay).
# Kết quả: tools/bot-bench/results/<tag>.txt và báo cáo docs/bot-results/ được GitHub tự cập nhật và commit vào main.

on:
  push:
    branches: [main]
    paths: ["tools/bot-bench/request.txt"]
  workflow_dispatch:

concurrency: { group: bot-bench, cancel-in-progress: false }

env:
  GRADLE_VERSION: "8.14.3"
  SF_TAG: "sf_17.1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: python3 tools/bot-bench/plan.py tools/bot-bench/request.txt >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - uses: actions/cache@v4
        if: contains(matrix.cmds, 'gauge ')
        id: sfcache
        with: { path: sfbin, key: "stockfish-${{ env.SF_TAG }}-avx2" }
      - name: Build Stockfish (engine đo, GPL-3.0, không phát hành)
        if: contains(matrix.cmds, 'gauge ') && steps.sfcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SF_TAG" https://github.com/official-stockfish/Stockfish.git sf
          make -C sf/src -j"$(nproc)" build ARCH=x86-64-avx2 >/dev/null
          mkdir -p sfbin && cp sf/src/stockfish sfbin/stockfish
      - name: Run
        env: { CMDS: "${{ matrix.cmds }}" }
        run: |
          CP=$(gradle :core:benchClasspath --no-daemon -q | sed -n 's/^CP=//p')
          i=0
          IFS='|' read -ra LIST <<< "$CMDS"
          for c in "${LIST[@]}"; do
            c=${c/ SF / $PWD/sfbin/stockfish }
            java -Xss16m -cp "$CP" com.fws.playmind.core.bench.BenchMainKt $c > "out-$i.txt" 2>&1 &
            i=$((i+1))
          done
          wait
          mkdir -p part
          for f in out-*.txt; do
            grep -q '^TOTAL' "$f" || { echo "::error::lỗi chạy đo"; cat "$f"; exit 1; }
            { echo "# job=${{ matrix.job }} shard=${{ matrix.shard }} cpu=$(nproc) $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"; grep -E '^(R|G|TOTAL) ' "$f"; } > "part/${{ matrix.label }}-$f"
          done
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.label }}", path: part/ }

  collect:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Gom kết quả và sinh báo cáo
        run: |
          python3 tools/bot-bench/collect.py tools/bot-bench/request.txt parts "$(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/bot-bench/make_reports.py
          python3 tools/bot-bench/make_profiles.py
      - name: Commit vào main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/bot-bench/results docs/bot-results docs/games
          git diff --cached --quiet && exit 0
          git commit -m "Kết quả đo bot: ${{ needs.plan.outputs.tag }}"
          for n in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((n * 10))
          done
          exit 1
