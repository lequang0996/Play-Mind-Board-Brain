name: Bot bench

# Đo bot (BOT_GUIDE mục 3): đấu giữa các cấp (ladder) và đấu engine ngoài (gauge, Stockfish chỉ để đo, không phát hành).
# Kích hoạt: sửa tools/bot-bench/request.txt rồi push lên main (hoặc chạy tay).
# Kết quả: tools/bot-bench/results/<tag>.txt và báo cáo docs/bot-results/ được GitHub tự cập nhật và commit vào main.

on:
  push:
    branches: [main]
    paths: ["tools/bot-bench/request.txt"]
  workflow_dispatch:

concurrency: { group: bot-bench, cancel-in-progress: false }

env:
  GRADLE_VERSION: "8.14.3"
  SF_TAG: "sf_17.1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: python3 tools/bot-bench/plan.py tools/bot-bench/request.txt >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - uses: actions/cache@v4
        if: contains(matrix.cmds, 'gauge ')
        id: sfcache
        with: { path: sfbin, key: "stockfish-${{ env.SF_TAG }}-avx2" }
      - name: Build Stockfish (engine đo, GPL-3.0, không phát hành)
        if: contains(matrix.cmds, 'gauge ') && steps.sfcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SF_TAG" https://github.com/official-stockfish/Stockfish.git sf
          make -C sf/src -j"$(nproc)" build ARCH=x86-64-avx2 >/dev/null
          mkdir -p sfbin && cp sf/src/stockfish sfbin/stockfish
      - name: Fetch Pikafish (engine đo cờ tướng, GPL-3.0, không phát hành)
        if: contains(matrix.cmds, 'gauge xiangqi')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          rel=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/official-pikafish/Pikafish/releases/latest)
          url=$(echo "$rel" | python3 -c "import sys,json;print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.7z')][0])")
          echo "Pikafish: $url"
          mkdir -p pf && curl -sL "$url" -o pf/pf.7z && (cd pf && 7z x -y pf.7z >/dev/null)
          # tệp chạy Linux: bản mới tên Pikafish-Linux-x86-64-universal, bản cũ có chữ avx2
          bin=$(find "$PWD/pf" -type f -iname '*linux*' ! -iname '*.exe' | head -1)
          [ -n "$bin" ] || bin=$(find "$PWD/pf" -type f -iname '*avx2*' ! -iname '*.exe' | grep -iv -e windows -e mac -e android | head -1)
          net=$(find "$PWD/pf" -name '*.nnue' | head -1)
          test -n "$bin" && test -n "$net" || { find pf -maxdepth 3; echo "::error::không tìm thấy Pikafish/nnue"; exit 1; }
          chmod +x "$bin"; echo "PFBIN=$bin" >> "$GITHUB_ENV"; echo "PFNET=$net" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: contains(matrix.cmds, 'ladder go ')
        id: kgcache
        with: { path: kgbin, key: "katago-linux-${{ hashFiles('tools/katago/build_linux.sh') }}" }
      - name: Build KataGo for Linux (engine cờ vây, MIT; mạng g170 CC0)
        if: contains(matrix.cmds, 'ladder go ') && steps.kgcache.outputs.cache-hit != 'true'
        run: bash tools/katago/build_linux.sh kgbin
      - name: KataGo env
        if: contains(matrix.cmds, 'ladder go ')
        run: |
          sudo apt-get install -y -qq libgomp1 zlib1g >/dev/null || true
          # thử khởi động: in kết quả thành annotation (đọc được không cần đăng nhập) để biết lỗi nếu có
          printf 'logToStderr = true
logSearchInfo = false
' > kgsmoke.cfg
          out=$(printf 'version
boardsize 19
kata-raw-nn b 0
quit
' | timeout 120 kgbin/katago gtp -model kgbin/b6.bin.gz -config kgsmoke.cfg 2>&1 | head -c 1500 | tr '
' ' ' || true)
          echo "::warning::KataGo smoke: ${out:0:900}"
          ldd kgbin/katago | grep -i "not found" && echo "::error::thiếu thư viện" || true
          echo "KATAGO=$PWD/kgbin/katago" >> "$GITHUB_ENV"; echo "KG_B6=$PWD/kgbin/b6.bin.gz" >> "$GITHUB_ENV"; echo "KG_B10=$PWD/kgbin/b10.bin.gz" >> "$GITHUB_ENV"
      - name: Run
        env: { CMDS: "${{ matrix.cmds }}" }
        run: |
          CP=$(gradle :core:benchClasspath --no-daemon -q | sed -n 's/^CP=//p')
          i=0
          IFS='|' read -ra LIST <<< "$CMDS"
          for c in "${LIST[@]}"; do
            c=${c/ SF / $PWD/sfbin/stockfish }; c=${c/ PF / ${PFBIN:-PF} }; c=${c/ PFNET/ ${PFNET:-PFNET}}
            java -Xss16m -cp "$CP" com.fws.playmind.core.bench.BenchMainKt $c > "out-$i.txt" 2>&1 &
            i=$((i+1))
          done
          wait
          mkdir -p part; bad=0
          for f in out-*.txt; do
            { echo "# job=${{ matrix.job }} shard=${{ matrix.shard }} cpu=$(nproc) $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"; grep -E '^(R|G|TOTAL|# engine) ' "$f" || true; } > "part/${{ matrix.label }}-$f"
            if ! grep -q '^TOTAL' "$f"; then
              # lỗi: ghi 15 dòng cuối vào phần kết quả (collect.py chép vào tệp kết quả để đọc được mà không cần đăng nhập)
              echo "::error::lỗi chạy đo"; cat "$f"; bad=1
              tail -n 15 "$f" | sed 's/^/#! /' >> "part/${{ matrix.label }}-$f"
            fi
          done
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "part-${{ matrix.label }}", path: part/ }

  collect:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Gom kết quả, sinh báo cáo và commit vào main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # giữ request của chính lần chạy này (main có thể đã có request mới hơn)
          cp tools/bot-bench/request.txt "$RUNNER_TEMP/request.txt"
          day="$(date -u +%Y-%m-%d)"
          for n in 1 2 3 4 5; do
            # mỗi lần thử: lấy main mới nhất rồi sinh lại kết quả trên đó (tránh xung đột khi rebase)
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/bot-bench/collect.py "$RUNNER_TEMP/request.txt" parts "$day" > "$RUNNER_TEMP/summary.md"
            python3 tools/bot-bench/make_reports.py
            python3 tools/bot-bench/make_profiles.py
            git add tools/bot-bench/results docs/bot-results docs/games
            git diff --cached --quiet && break
            git commit -q -m "Kết quả đo bot: ${{ needs.plan.outputs.tag }}"
            git push -q origin HEAD:main && break
            sleep $((n * 15))
            [ $n -eq 5 ] && exit 1
          done
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
