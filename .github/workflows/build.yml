name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 1) Kiểm tra luật cờ + AI (perft, chiếu hết, caro...)
      - name: Core self-check
        run: gradle :core:selfCheck --no-daemon

      # 2) Build debug để chắc chắn app biên dịch được
      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      # 3) Build release có ký (chỉ khi đã cấu hình secrets)
      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release (AAB + APK, R8 bật)
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ID AdMob thật (nếu không đặt sẽ dùng ID TEST của Google)
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER: ${{ vars.ADMOB_BANNER }}
          ADMOB_INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ vars.ADMOB_REWARDED }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: playmind-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1   # Artifacts tự động bị xóa sau 1 ngày

      - uses: actions/upload-artifact@v4
        with:
          name: playmind-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn
          retention-days: 1   # Artifacts tự động bị xóa sau 1 ngày
