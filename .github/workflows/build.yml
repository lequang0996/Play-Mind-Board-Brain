name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 1) Kiểm tra luật cờ + AI (perft, chiếu hết, caro...)
      - name: Core self-check
        run: gradle :core:selfCheck --no-daemon

      # 2) Giải mã keystore và kiểm tra alias/mật khẩu
      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Keystore/alias/mật khẩu không hợp lệ -> build release KHÔNG ký. Kiểm tra secrets KEYSTORE_PASSWORD và KEY_ALIAS."
            fi
          else
            echo "::warning::Chưa có secret KEYSTORE_BASE64 -> build release KHÔNG ký."
          fi

      # 3) Build release (AAB + APK, R8 bật)
      - name: Build release (AAB + APK, R8 bật)
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ID AdMob thật (nếu không đặt sẽ dùng ID TEST của Google)
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER: ${{ vars.ADMOB_BANNER }}
          ADMOB_INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL }}
          ADMOB_APP_OPEN: ${{ vars.ADMOB_APP_OPEN }}
          ADMOB_REWARDED: ${{ vars.ADMOB_REWARDED }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}

      # 4) Chỉ xuất đúng 2 file: APK release và AAB release
      - uses: actions/upload-artifact@v4
        with:
          name: playmind-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: playmind-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
