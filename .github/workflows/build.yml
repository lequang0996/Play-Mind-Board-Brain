name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 1) Kiểm tra luật cờ + AI (perft, chiếu hết, caro...)
      - name: Core self-check
        run: gradle :core:selfCheck --no-daemon

      # 2) Giải mã keystore và kiểm tra alias/mật khẩu
      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Keystore/alias/mật khẩu không hợp lệ -> build release KHÔNG ký. Kiểm tra secrets KEYSTORE_PASSWORD và KEY_ALIAS."
            fi
          else
            echo "::warning::Chưa có secret KEYSTORE_BASE64 -> build release KHÔNG ký."
          fi

      # 3) Kiểm tra ID quảng cáo: bản release phải dùng ID thật, không phải ID thử nghiệm của Google
      - name: Check AdMob IDs
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || secrets.ADMOB_APP_ID }}
          ADMOB_BANNER: ${{ vars.ADMOB_BANNER || secrets.ADMOB_BANNER }}
          ADMOB_APP_OPEN: ${{ vars.ADMOB_APP_OPEN || secrets.ADMOB_APP_OPEN }}
        run: |
          bad=""
          for n in ADMOB_APP_ID ADMOB_BANNER ADMOB_APP_OPEN; do
            v="${!n}"
            if [ -z "$v" ]; then echo "::error::$n chưa được đặt (Settings > Secrets and variables > Actions > Variables)"; bad=1
            elif [[ "$v" == ca-app-pub-3940256099942544* ]]; then echo "::error::$n đang là ID THỬ NGHIỆM của Google"; bad=1
            else echo "$n: OK (${v:0:16}…)"; fi
          done
          [[ "$ADMOB_APP_ID" == *"~"* || -z "$ADMOB_APP_ID" ]] || { echo "::error::ADMOB_APP_ID phải có dạng ca-app-pub-xxx~yyy (dấu ~), không phải ID đơn vị quảng cáo (dấu /)"; bad=1; }
          for n in ADMOB_BANNER ADMOB_APP_OPEN; do v="${!n}"; [[ -z "$v" || "$v" == *"/"* ]] || { echo "::error::$n phải có dạng ca-app-pub-xxx/yyy (dấu /)"; bad=1; }; done
          [ -z "$bad" ] || exit 1

      # 4) KataGo cho cờ vây (mã MIT, mạng CC0): biên dịch bằng NDK cho arm64-v8a, armeabi-v7a, x86_64 và tải 2 mạng.
      #    Kết quả được cache theo phiên bản trong script, nên chỉ lần đầu (hoặc khi đổi phiên bản) mới tốn thời gian.
      - name: Cache KataGo
        id: kgcache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/katago
          key: katago-${{ hashFiles('tools/katago/build_android.sh') }}

      - name: Build KataGo for Android
        if: steps.kgcache.outputs.cache-hit != 'true'
        run: bash tools/katago/build_android.sh

      - name: Check KataGo files
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do test -s app/src/main/jniLibs/$abi/libkatago.so || { echo "::error::Thiếu libkatago.so ($abi)"; exit 1; }; done
          test -s app/src/main/assets/katago/b6.bin.gz && test -s app/src/main/assets/katago/b10.bin.gz

      # 5) Build release (AAB + APK, R8 bật)
      - name: Build release (AAB + APK, R8 bật)
        run: |
          # NDK có sẵn trên máy CI: Gradle dùng nó để trích biểu tượng gỡ lỗi native vào .aab và strip thư viện
          export ANDROID_NDK_VERSION="$(basename "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}")"
          echo "NDK $ANDROID_NDK_VERSION"
          # lỗi biên dịch / lint hiện thành chú thích (đọc được trên trang Actions và qua API mà không cần mở log)
          set -o pipefail
          gradle :app:bundleRelease :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "^e: |Error:|error:|FAILURE|What went wrong" -A2 "$RUNNER_TEMP/build.log" | head -40 | sed 's/^/::error::/'
            exit 1
          }
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ID AdMob thật: đọc từ tab Variables, nếu trống thì lấy từ tab Secrets.
          # App chỉ dùng banner + quảng cáo mở app. Thiếu ID thật -> build release DỪNG (không xuất bản "Test Ad").
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || secrets.ADMOB_APP_ID }}
          ADMOB_BANNER: ${{ vars.ADMOB_BANNER || secrets.ADMOB_BANNER }}
          ADMOB_APP_OPEN: ${{ vars.ADMOB_APP_OPEN || secrets.ADMOB_APP_OPEN }}
          REQUIRE_REAL_ADS: "true"
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          # Địa chỉ Firebase Realtime Database làm trạm chuyển mã khi chơi qua internet (tab Variables). Trống = trao đổi mã hai chiều.
          SIGNAL_DB_URL: ${{ vars.SIGNAL_DB_URL }}

      # 5b) Biểu tượng gỡ lỗi native phải nằm trong .aab (nếu không, Play Console cảnh báo và không phân tích được crash/ANR)
      - name: Check native debug symbols in AAB
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          if ! unzip -l "$aab" | grep -E 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/.*libkatago[.]so'; then
            echo "::error::Thiếu biểu tượng gỡ lỗi của libkatago.so trong $aab"
            unzip -l "$aab" | grep -i debugsymbols || true
            exit 1
          fi

      # 6) Chỉ xuất đúng 2 file: APK release và AAB release
      - uses: actions/upload-artifact@v4
        with:
          name: playmind-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: playmind-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
